spring.application.name=ventas
server.port=8080

# CONFIGURACION MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/pos_db?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# CONFIGURACION JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# No modificar las tablas existentes
spring.jpa.hibernate.ddl-auto=none

# Mostrar consultas SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# CONFIGURACION POOL DE CONEXIONES
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

#seguridad
jwt.secret=MIcontraseñaSupersegura@12345678
jwt.expiration-ms=28800000